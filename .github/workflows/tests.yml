name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m compileall -q src installer.py tests
      - run: python -m unittest discover -s tests -p 'test_unit*.py' -v
      - run: bash -n install.sh scripts-bootstrap.sh
      - run: shellcheck install.sh scripts-bootstrap.sh
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 haproxy
      - run: sudo unshare --net python3 tests/test_network.py
